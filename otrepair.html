<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPhone Repair Services</title>
    <link rel="stylesheet" href="iphonerepair.css">
</head>
<body>

    <!-- Header Section -->
    <header>
        <h1>Phone Repair Services</h1>
        <p>Fast & Reliable Repairs for All iPhone Models</p>
    </header>

    <!-- Services Section -->
    <section class="services">
        <h2>Our Repair Services</h2>
        <div class="service-list">
            <div class="service">
                <img src="images/R.jpeg" alt="Screen Repair">
                <h3>Screen Replacement</h3>
                <p>Fix cracked or broken iPhone screens.</p>
               
            </div>
            <div class="service">
                <img src="images/ba.jpeg" alt="Battery Replacement">
                <h3>Battery Replacement</h3>
                <p>Replace old or weak iPhone batteries.</p>
                
            </div>
            <div class="service">
                <img src="images/water.jpeg" alt="Water Damage Repair">
                <h3>Water Damage Repair</h3>
                <p>Restore iPhones affected by water damage.</p>
                 
            </div>
          
        </div>
    </section>

    <!-- Contact Section -->
    

</body>
</html>

    <style>

@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body {
    background: #000000;
    color: #7e7a7ad8;
    text-align: center;
    padding: 20px;
}

/* Header */
header {
    background: #7a7878;
    color: #070707;
    padding: 30px;
    border-radius: 10px;
    margin-bottom: 20px;
}

header h1 {
    font-size: 2.5rem;
}

header p {
    font-size: 1.2rem;
}

/* Services */
.services {
    padding: 20px;
}

.services h2 {
    font-size: 2rem;
    margin-bottom: 20px;
}

.service-list {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 20px;
}

.service {
    background: #da8f8f33;
    padding: 20px;
    border-radius: 10px;
    width: 250px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    transition: 0.3s;
}

.service:hover {
    transform: translateY(-5px);
}

.service img {
    width: 60px;
    height: 60px;
    margin-bottom: 10px;
}

.service h3 {
    font-size: 1.4rem;
    margin-bottom: 10px;
}

.service p {
    font-size: 1rem;
    margin-bottom: 15px;
}

.service button {
    background: #ff5733;
    color: #fff;
    padding: 10px 15px;
    border: none;
    font-size: 1rem;
    cursor: pointer;
    border-radius: 5px;
    transition: 0.3s;
}

.service button:hover {
    background: #d1401c;
}

 
/* Responsive Design */
@media screen and (max-width: 768px) {
    .service-list {
        flex-direction: column;
        align-items: center;
    }

    .service {
        width: 90%;
    }

    header h1 {
        font-size: 2rem;
    }

    header p, .contact p {
        font-size: 1rem;
    }
}
</style>
</body>
</html>
